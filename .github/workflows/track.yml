name: Track Thornton Place Creekside Prices

on:
  schedule:
    # Runs at 13:00 UTC daily = 5:00 AM Pacific (6:00 AM during PST)
    # Adjust the hour if you want a different time of day.
    - cron: '0 13 * * *'
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated tracker/HTML back to the repo

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --quiet openpyxl playwright
          python -m playwright install --with-deps chromium

      - name: Install LibreOffice (for xlsx formula recalculation)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-calc

      - name: Run tracker
        run: python scripts/track_thornton.py

      - name: Commit and push changes (if any)
        run: |
          git config user.name "thornton-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily Thornton Place tracker update - $(date -u +'%Y-%m-%d')"
            git push
          fi
